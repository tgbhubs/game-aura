name: Ajustar áreas (ConectCar)
on:
  push:
    branches: [main]
    paths: ['scripts/areas-conectcar.js']
  workflow_dispatch:
jobs:
  areas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd functions && npm install --no-audit --no-fund
      - name: Credenciais
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: printf '%s' "$SA" > "$HOME/sa.json"
      - name: Rodar ajuste
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          cp scripts/areas-conectcar.js functions/ && cd functions && node areas-conectcar.js
      - if: always()
        run: rm -f "$HOME/sa.json"
