name: Info da temporada (leitura)
on:
  workflow_dispatch:
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd functions && npm install --no-audit --no-fund
      - env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: printf '%s' "$SA" > "$HOME/sa.json"
      - run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          cp scripts/info-temporada.js functions/ && cd functions && node info-temporada.js
      - if: always()
        run: rm -f "$HOME/sa.json"
