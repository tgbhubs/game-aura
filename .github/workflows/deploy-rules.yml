name: Publicar regras do Firestore
on:
  push:
    branches: [main]
    paths: ['firestore.rules']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Credenciais
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$HOME/sa.json"
      - name: Publicar regras
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          PROJETO=$(node -p "require('./.firebaserc').projects.default")
          npx -y firebase-tools@13 deploy --only firestore:rules --project "$PROJETO" --non-interactive
