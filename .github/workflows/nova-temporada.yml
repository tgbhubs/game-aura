name: Virada para a Temporada 2
on:
  schedule:
    - cron: '5 3 30 11 *'
    - cron: '35 3 30 11 *'
  workflow_dispatch:
    inputs:
      seco:
        description: 'Só simular (1) ou executar (0)'
        default: '1'
jobs:
  virada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd functions && npm install --no-audit --no-fund
      - env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: printf '%s' "$SA" > "$HOME/sa.json"
      - env:
          SECO: ${{ github.event.inputs.seco || '0' }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          cp scripts/nova-temporada.js functions/ && cd functions && node nova-temporada.js
      - if: always()
        run: rm -f "$HOME/sa.json"
