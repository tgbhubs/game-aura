<style>
:root{
  --navy:#14235E; --navy2:#101C4C; --navy3:#0A1230; --lar:#EC7000; --itau:#FF6200; --azul:#499EF2; --areia:#F4F1EA;
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#14235E; --mut:#5A6482; --line:#DCD8CE; --soft:#EFEBE2;
  --ok:#17935F; --okbg:#E3F5EC; --err:#D23F3F; --errbg:#FCE9E9; --gold:#E9A820; --goldbg:#FFF5DC;
  --r:16px; --sh:0 1px 2px rgba(20,36,92,.06),0 6px 20px rgba(20,36,92,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.mont{font-family:'Montserrat',sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#app{padding-bottom:96px}
/* marca */
.pill-game{font-family:'Montserrat',sans-serif;font-weight:800;font-size:10px;letter-spacing:.14em;background:var(--lar);color:var(--navy);border-radius:99px;padding:3px 8px;margin-left:10px}
.pill-game.big{font-size:13px;padding:5px 11px;margin-left:14px}
/* topo */
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 0 14px;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
.demo{background:#FFF1E3;color:#A84E00;font-size:12.5px;padding:7px 0;border-bottom:1px solid #F3D3B0}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{background:none;border:1px solid #E7B888;border-radius:8px;padding:3px 8px;font-size:12px;color:#A84E00}
/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;justify-content:space-between;padding:0 6px}
.nav button{flex:1;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut)}
.nav button .ic{font-size:20px;line-height:1;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--navy)}
.nav button.on .ic{filter:none;opacity:1}
/* cartões */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:14px 0}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.sec{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.mut{color:var(--mut)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:18px;margin:16px 0;position:relative;overflow:hidden}
.hero .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h2{font-size:24px;font-weight:900;margin:4px 0 2px}
.hero .cd{display:inline-block;margin-top:10px;background:rgba(255,255,255,.12);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;position:relative;z-index:1}
.game{border-radius:18px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:168px;display:flex;flex-direction:column}
.game.qz{background:var(--navy)}
.game.cr{background:var(--lar);color:var(--navy)}
.game .em{font-size:30px}
.game h3{font-size:17px;font-weight:900;margin:6px 0 2px}
.game .st{font-size:13px;opacity:.9;flex:1}
.game .btn{margin-top:12px}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--navy);color:#fff;min-height:46px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.lar{background:var(--lar);color:var(--navy)}
.btn.wh{background:#fff;color:var(--navy)}
.btn.gh{background:var(--soft);color:var(--navy)}
.btn.out{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.red{background:var(--errbg);color:var(--err)}
.btn.sm{min-height:34px;padding:7px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{background:none;border:0;color:var(--navy);font-weight:700;padding:4px;text-decoration:underline;text-underline-offset:3px}
/* formulários */
label.f{display:block;margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--mut)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--navy)}
textarea.inp{min-height:84px;resize:vertical}
.err{background:var(--errbg);color:var(--err);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.okm{background:var(--okbg);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:14px 0}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:13.5px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--mut)}
.chip.on{border-color:var(--navy);color:var(--navy);background:#EEF2FF}
/* avatar */
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;font-family:'Montserrat',sans-serif}
.bdg .av,.rk .av{color:#fff;font-size:13px;display:inline-flex}
.av.lg{width:84px;height:84px;font-size:28px}
.av.sm{width:28px;height:28px;font-size:11px}
/* ranking */
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .pos{width:28px;text-align:center;font-family:'Montserrat',sans-serif;font-weight:900;color:var(--mut);font-size:15px}
.rk .pos.p1,.rk .pos.p2,.rk .pos.p3{color:#A84E00}
.rk .nm{flex:1;min-width:0}
.rk .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.rk .nm span{font-size:12px;color:var(--mut)}
.rk .pt,.rkc-top .pt{text-align:right;font-family:'Montserrat',sans-serif;font-weight:900;font-size:17px;color:var(--navy)}
.rk .pt small,.rkc-top .pt small{display:block;font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--mut)}
.rk.eu{background:#FFF1E3;margin:0 -16px;padding:10px 16px}
.rk.fora{opacity:.5}
/* números */
.kp{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.kp b{display:block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;color:var(--navy)}
.kp span{font-size:12px;color:var(--mut)}
/* badges */
.bdg{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0;border:0;width:100%;text-align:left}
.bdg .e{font-size:28px;width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bdg b{display:block;font-size:14.5px}
.bdg span{font-size:12.5px;color:var(--mut)}
.bdg.novo{background:#FFF1E3;box-shadow:inset 0 0 0 1.5px #F3D3B0}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bcell{background:var(--soft);border-radius:14px;padding:12px 6px;text-align:center;border:0}
.bcell .e{font-size:30px}
.bcell b{display:block;font-size:12px;margin-top:4px}
.bcell span{font-size:11px;color:var(--mut)}
.bcell.off{opacity:.35;filter:grayscale(1)}
/* tabela */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;padding:6px 4px;border-bottom:1.5px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--mut)}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.err{background:var(--errbg);color:var(--err)} .tag.gold{background:#FFF1E3;color:#A84E00} .tag.nv{background:#E8EEF9;color:#1C398E}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:24px 0 10px}
.foot button{margin:4px}
/* telas de entrada */
.auth{min-height:100vh;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 32px) 0 40px}
.auth .tagline{opacity:.8;margin:10px 0 22px}
.auth .card{color:var(--ink)}
.stripes{display:flex;gap:6px;margin:18px 0 6px}
.stripes i{display:block;width:34px;height:10px;transform:skewX(-24deg);border-radius:2px}
.gbtn{background:#fff;color:#222;border:1.5px solid var(--line)}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
/* overlay de jogo */
#ov{position:fixed;inset:0;z-index:60;display:none;background:var(--navy3);color:#fff;overflow:auto}
#ov.on{display:block}
.ovw{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 30px;min-height:100vh;display:flex;flex-direction:column}
.ovtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.xbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;width:38px;height:38px;font-size:18px}
.qbar{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.qbar i{display:block;height:100%;background:var(--lar);border-radius:99px;width:100%}
.qtema{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.7}
.qtxt{font-family:'Montserrat',sans-serif;font-weight:800;font-size:21px;line-height:1.3;margin:8px 0 20px}
.alt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:14px;margin:0 0 10px;font-size:15.5px;font-weight:600;min-height:58px}
.alt .l{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:900;flex:none}
.alt.esc{border-color:#fff;background:rgba(255,255,255,.18)}
.alt.cer{background:var(--ok);border-color:var(--ok)}
.alt.err{background:var(--err);border-color:var(--err)}
.alt[disabled]{cursor:default}
.qtime{font-family:'Montserrat',sans-serif;font-weight:900;font-size:15px}
.fb{font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px;text-align:center;margin:6px 0}
.big{font-family:'Montserrat',sans-serif;font-weight:900;font-size:56px;line-height:1}
.ovcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;margin:12px 0}
.ovcard .mut{color:rgba(255,255,255,.7)}
#cv{display:block;margin:0 auto;border-radius:14px;touch-action:none;background:#2a3140}
.garagem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.garagem.off{opacity:.5}
.gcar{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 6px 9px;color:#F4F1EA;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.gcar img{width:100%;aspect-ratio:300/170;object-fit:contain;display:block;margin-bottom:4px}
.gcar b{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800}
.gcar span{font-size:10.5px;opacity:.7;line-height:1.25;text-align:center}
.gcar.on{background:#F4F1EA;color:var(--navy);border-color:var(--lar);box-shadow:0 0 0 2px var(--lar)}
.gcar.on span{opacity:.75}
.logo-home{display:flex;align-items:center;background:none;border:0;padding:4px 6px 4px 0;margin:0;cursor:pointer;border-radius:10px}
.logo-home:focus-visible{outline:2px solid var(--lar);outline-offset:2px}
.hint{text-align:center;font-size:12.5px;opacity:.7;margin-top:8px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(10,18,45,.55);align-items:flex-end;justify-content:center}
#modal.on{display:flex}

var _cache = { chave: '', val: null };
function calcTemporada(tid, fonteRod, fontePlac) {
  var temp = D.temporadas[tid] || D.outrasTemp[tid] || {};
  var rods = rodadasDe(tid, fonteRod);
  var P = fontePlac || D.placares;
  var chave = tid + '|' + JSON.stringify(P).length + '|' + rods.length + '|' + Math.floor(Date.now() / 60000) + '|' + (temp.status || '') + '|' + Object.keys(D.jogadores).length;

    if (now < r.inicio) return;
    var linhas = linhasRodada(P[r.id], k);
    res.rod[r.id] = linhas;
    res.areaRod[r.id] = areasDe(linhas, 'rodada');
    linhas.forEach(function (l) {
      var x = acum[l.uid] = acum[l.uid] || { uid: l.uid, total: 0, rodadas: 0, quiz: 0, corrida: 0, a: l.a, ap: l.ap, nm: l.nm };
      x.total += l.total; x.rodadas++; x.quiz += l.qp; x.corrida += l.cp; x.a = l.a; x.ap = l.ap; x.nm = l.nm;
      if (l.q === 10) add(l.uid, 'gabaritou', r);
      if (l.c >= 120) add(l.uid, 'piloto', r);
      if (l.q === 10 && l.c >= 90) add(l.uid, 'combo', r);
    });
    var fechada = now > r.fim;
    r.fechada = fechada;
    var rk = rankingAcumulado(acum);
    res.acumAte[r.id] = rk;
    if (!fechada) return;
    if (linhas.length && linhas[0].total > 0) linhas.forEach(function (l) { if (l.total === linhas[0].total) add(l.uid, 'liderRodada', r); });
    var gab = linhas.filter(function (l) { return l.q === 10; });
    if (gab.length) { var mn = Math.min.apply(null, gab.map(function (l) { return l.qms; })); gab.forEach(function (l) { if (l.qms === mn) add(l.uid, 'relampago', r); }); }
    var ar = res.areaRod[r.id].filter(function (x) { return x.elegivel; });
    if (ar.length >= 2) linhas.forEach(function (l) { if (l.a === ar[0].areaId) add(l.uid, 'timeCampeao', r); });
    var jogaram = {}; linhas.forEach(function (l) { jogaram[l.uid] = true; });
    Object.keys(streak).forEach(function (u) { if (!jogaram[u]) streak[u] = 0; });
    linhas.forEach(function (l) { streak[l.uid] = (streak[l.uid] || 0) + 1; if (streak[l.uid] % 4 === 0) add(l.uid, 'presenca', r); });
    var agora = {}; rk.forEach(function (x) { agora[x.uid] = x.pos; });
    if (antes) Object.keys(agora).forEach(function (u) { if (antes[u] && antes[u] - agora[u] >= 5) add(u, 'virada', r); });
    antes = agora;
  });

  var ultima = rods[rods.length - 1];
  res.encerrada = temp.status === 'encerrada' || (ultima && now > ultima.fim);
  if (res.encerrada && res.final.length && res.final[0].total > 0) res.final.forEach(function (x) { if (x.total === res.final[0].total) add(x.uid, 'liderTemporada', null); });

}

créditos</b> para a Garagem: 20% dos pontos que o tempo valeria na rodada. O seu melhor tempo entra no <b>ranking de treinos</b> (da semana e geral), onde valem os atributos do carro.</li></ul>' +

function gerarQeq(v) {

function processarFoto(input) {
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var img = new Image();
    img.onload = function () {
      var T = 128, cv = document.createElement('canvas'); cv.width = T; cv.height = T;
      var ctx = cv.getContext('2d'), m = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, T, T);
      var url = cv.toDataURL('image/jpeg', 0.72);
      // no cadastro ainda não existe o jogador: guarda para salvar junto e só atualiza a prévia (sem redesenhar o formulário)
      if (!S.me) { S.fotoCad = url; var pv = $('#fFotoPrev'); if (pv) pv.innerHTML = '<img src="' + url + '" alt="">'; var st = $('#fFotoTxt'); if (st) st.textContent = 'Foto escolhida. Pode trocar se quiser.'; return; }
      B.update('jogadores/' + S.user.uid, { foto: url }).then(function () { toast('Foto atualizada.'); if ($('#modal').className === 'on' && $('#modalFoto')) fecharModal(); }).catch(function (e) { toast(msgErro(e)); });
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f); input.value = '';
}

function validarCadastro(c) {
  if (c.nome.split(/\s+/).length < 2) return 'Informe nome e sobrenome.';
  if (!c.apelido) return 'Escolha um apelido para o ranking.';
  if (!c.area) return 'Selecione sua área.';
  if (c.area === '__nova' && c.areaNova.length < 2) return 'Digite o nome da sua área.';
  if (!S.fotoCad && !(S.user && S.user.foto)) return 'Coloque uma foto: o jogo é para o time se conhecer.';
  return '';

function salvarCadastro(c) {
  var uid = S.user.uid;
  var areaId = c.area;
  var passos = Promise.resolve();
  if (c.area === '__nova') {
    areaId = slug(c.areaNova);
    if (!D.areas[areaId]) passos = passos.then(function () { return B.set('areas/' + areaId, { nome: c.areaNova, status: 'pendente', criadaPor: uid, criadaEm: Date.now() }); });
  }
  var base = { uid: uid, nome: c.nome, apelido: c.apelido.slice(0, 18), email: S.user.email || '', areaId: areaId, foto: S.fotoCad || S.user.foto || '', curiosidades: [], criadoEm: Date.now(), codigoAcesso: c.codigo || '' };
  var aviso = '';

    if (!cfg || !cfg.masterUid) return B.set('config/geral', { masterUid: uid }).then(function () { return true; }, function () { return false; });
    return cfg.masterUid === uid;
  }).then(function (souMaster) {

  salvarK: function () { var k = parseFloat($('#kVal').value); if (!(k >= 10)) return; B.set('temporadas/' + tempAtivaId(), { k: k }, true).then(function () { fecharModal(); }); },
  novaTemporada: function () { abrirModal(formTemporada()); },
  salvarTemporada: function () { salvarTemporada(); },
  gerarRodadas: function () { abrirConfirma('Montar as rodadas?', 'O app vai sortear as perguntas de todas as rodadas da temporada agora. Rodadas futuras podem ser sorteadas de novo depois.', 'Montar', gerarRodadas); },
  verRodada: function (v) { verRodada(v); },
  regerarRodada: function (v) { regerarRodada(v); },
  encerrarTemporada: function () {
    abrirConfirma('Encerrar a temporada?', 'O ranking final fica fechado e ninguém joga mais nesta temporada.', 'Encerrar', function () {
      B.set('temporadas/' + tempAtivaId(), { status: 'encerrada', encerradaEm: Date.now() }, true).then(function () { toast('Temporada encerrada.'); });
    }, true);
  },
  pergFiltro: function (v) { S.pergFiltro = v; R(); },
  novaPergunta: function () { S._qeqNovo = null; abrirModal(formPergunta(null)); },
  editarPergunta: function (v) { abrirModal(formPergunta(v)); },
  salvarPergunta: function (v) { salvarPergunta(v || null); },
  excluirPergunta: function (v) { abrirConfirma('Excluir esta pergunta?', 'Ela sai do banco. Rodadas já montadas mantêm a cópia delas.', 'Excluir', function () { B.del('perguntas/' + v).then(function () { toast('Pergunta excluída.'); }); }, true); },
  excluirPerguntaDireto: function (v) { B.del('perguntas/' + v).then(function () { toast('Pergunta excluída.'); }); },
  importarBanco: function () { importarBanco(); },
  pessoasFiltro: function (v) { S.pessoasFiltro = v; R(); },
  statusPessoa: function (v) { var p = v.split('|'); B.update('jogadores/' + p[0], { status: p[1] }).then(function () { toast(p[1] === 'ativo' ? 'Acesso liberado.' : 'Acesso bloqueado.'); }).catch(function (e) { toast(msgErro(e)); }); },
  papelPessoa: function (v) { var j = D.jogadores[v]; B.update('jogadores/' + v, { papel: j.papel === 'adm' ? 'jogador' : 'adm' }).catch(function (e) { toast(msgErro(e)); }); },
  novaArea: function () { abrirModal('<h3>Nova área</h3><input class="inp" id="aNome" maxlength="40" placeholder="Nome da área"><div class="mact"><button class="btn gh" data-a="fecharModal">Cancelar</button><button class="btn lar" data-a="salvarArea">Salvar</button></div>'); },
  salvarArea: function (v) {
    var n = $('#aNome').value.trim(); if (n.length < 2) return;
    var id = v || slug(n);
    B.set('areas/' + id, v ? { nome: n } : { nome: n, status: 'ativa', criadaEm: Date.now() }, !!v).then(function () { fecharModal(); });
  },
  aprovarArea: function (v) { B.set('areas/' + v, { status: 'ativa' }, true); },
  renomearArea: function (v) { abrirModal('<h3>Renomear área</h3><input class="inp" id="aNome" maxlength="40" value="' + esc(D.areas[v].nome) + '"><div class="mact"><button class="btn gh" data-a="fecharModal">Cancelar</button><button class="btn lar" data-a="salvarArea" data-v="' + v + '">Salvar</button></div>'); },
  excluirArea: function (v) { abrirConfirma('Excluir a área ' + D.areas[v].nome + '?', 'Nenhuma pessoa está nela.', 'Excluir', function () { B.del('areas/' + v); }, true); },
  admRodadaCorrida: function (v) { S.admRodadaCorrida = v; R(); },
  recarregarCorridas: function () { D.admCorridas = null; R(); },
  anular: function (v) {
    var p = v.split('|');
    B.chamar('anularTentativa', { rodadaId: p[0], uid: p[1], n: parseInt(p[2], 10), anular: p[3] === '1' }).then(function () { toast(p[3] === '1' ? 'Tentativa anulada.' : 'Tentativa restaurada.'); D.admCorridas = null; R(); })
      .catch(function (e) { toast(msgErro(e)); });
  },
  gerarQeq: function (v) { gerarQeq(v); }
};
Object.keys(A_PLACA).forEach(function (k) { A[k] = A_PLACA[k]; });
Object.keys(A_GAR).forEach(function (k) { A[k] = A_GAR[k]; });
// foto obrigatória para jogar: o objetivo é interação, todo mundo precisa ser reconhecível no ranking e nas mesas
function DEMO_SEM_FOTO() { return typeof DEMO !== 'undefined' && DEMO && !S.testeFoto; }
var ACOES_JOGO = { quiz: 1, corrida: 1, treino: 1, irCorrida: 1, paraValendo: 1, treinoDaqui: 1, comecarQuiz: 1, iniciarCorrida: 1, placaCriar: 1, placaCriarN: 1, placaCriarRobo: 1, placaEntrar: 1 };
function pedirFoto() {
  abrirModal('<div id="modalFoto"><h3>Coloque uma foto para jogar 📷</h3><p class="mut small">O Game Aura é para o time se conhecer: sua foto aparece no ranking, nas mesas do Placa! e nas conquistas. Escolha uma foto em que dê para ver seu rosto.</p>' +
    '<div class="mact"><button class="btn gh" data-a="fecharModal">Agora não</button><label class="btn lar" style="margin:0">Escolher foto<input type="file" accept="image/*" data-c="foto" style="display:none"></label></div></div>');
}
document.addEventListener('click', function (e) {
  var el = e.target.closest && e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  if (ACOES_JOGO[el.getAttribute('data-a')] && S.me && !S.me.foto && !DEMO_SEM_FOTO()) { e.preventDefault(); pedirFoto(); return; }
  var f = A[el.getAttribute('data-a')];
  if (f) { e.preventDefault(); f(el.getAttribute('data-v'), el, e); }
});
document.addEventListener('change', function (e) {
  var c = e.target.getAttribute && e.target.getAttribute('data-c');
  if (!c) return;
  if (c === 'areaNova') { var b = $('#boxAreaNova'); if (b) b.style.display = e.target.value === '__nova' ? 'block' : 'none'; }
  if (c === 'foto') processarFoto(e.target);
  if (c === 'importarPlanilha') importarPlanilha(e.target);
  if (c === 'rankTemp') { S.rankTemp = e.target.value; S.rankRodada = ''; e.target.blur(); R(); }
});
document.addEventListener('input', function (e) {
  var i = e.target.getAttribute && e.target.getAttribute('data-i');
  if (i === 'pergBusca') {
    S.pergBusca = e.target.value;
    clearTimeout(S._tb);
    S._tb = setTimeout(function () {
      var pos = e.target.selectionStart; render(true);
      var n = document.querySelector('[data-i=pergBusca]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } }
    }, 250);
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'fSenha' && S.authTela === 'login') A.entrar();
});
// atualiza contagens regressivas
setInterval(function () { if (!$('#ov').className && !$('#modal').className) render(); }, 60000);

/* ================== INÍCIO ================== */
function iniciar() {
  if (!DEMO && !FB_OK) { R(); return; }
  try { B = DEMO ? criarDemo() : criarFirebase(); } catch (e) { $('#app').innerHTML = '<div class="wrap"><div class="err">Falha ao iniciar: ' + esc(e.message) + '</div></div>'; return; }
  assinarBase();
  // após criar conta por e-mail, o cadastro é salvo assim que o login é reconhecido
  B.onAuth(function (u) {
    if (u && S._cadastroPend) {
      var c = S._cadastroPend; S._cadastroPend = null;
      setTimeout(function () {
        salvarCadastro(c).catch(function (er) { S.authErro = msgErro(er); }).then(function () { S.ocupado = false; R(); });
      }, 50);
    }
  });
  R();
}
iniciar();

</script>

</html>
