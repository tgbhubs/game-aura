<style>
:root{
  --navy:#14235E; --navy2:#101C4C; --navy3:#0A1230; --lar:#EC7000; --itau:#FF6200; --azul:#499EF2; --areia:#F4F1EA;
  --bg:#F4F1EA; --card:#FFFFFF; --ink:#14235E; --mut:#5A6482; --line:#DCD8CE; --soft:#EFEBE2;
  --ok:#17935F; --okbg:#E3F5EC; --err:#D23F3F; --errbg:#FCE9E9; --gold:#E9A820; --goldbg:#FFF5DC;
  --r:16px; --sh:0 1px 2px rgba(20,36,92,.06),0 6px 20px rgba(20,36,92,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.mont{font-family:'Montserrat',sans-serif;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
#app{padding-bottom:96px}
/* marca */
.pill-game{font-family:'Montserrat',sans-serif;font-weight:800;font-size:10px;letter-spacing:.14em;background:var(--lar);color:var(--navy);border-radius:99px;padding:3px 8px;margin-left:10px}
.pill-game.big{font-size:13px;padding:5px 11px;margin-left:14px}
/* topo */
.top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 0 14px;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between}
.demo{background:#FFF1E3;color:#A84E00;font-size:12.5px;padding:7px 0;border-bottom:1px solid #F3D3B0}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{background:none;border:1px solid #E7B888;border-radius:8px;padding:3px 8px;font-size:12px;color:#A84E00}
/* navegação */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;justify-content:space-between;padding:0 6px}
.nav button{flex:1;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut)}
.nav button .ic{font-size:20px;line-height:1;filter:grayscale(1);opacity:.6}
.nav button.on{color:var(--navy)}
.nav button.on .ic{filter:none;opacity:1}
/* cartões */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:14px 0}
.card h3{font-size:16px;font-weight:800;margin-bottom:8px}
.sec{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px}
.mut{color:var(--mut)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{background:var(--navy);color:#fff;border-radius:20px;padding:18px;margin:16px 0;position:relative;overflow:hidden}
.hero .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h2{font-size:24px;font-weight:900;margin:4px 0 2px}
.hero .cd{display:inline-block;margin-top:10px;background:rgba(255,255,255,.12);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;position:relative;z-index:1}
.game{border-radius:18px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:168px;display:flex;flex-direction:column}
.game.qz{background:var(--navy)}
.game.cr{background:var(--lar);color:var(--navy)}
.game .em{font-size:30px}
.game h3{font-size:17px;font-weight:900;margin:6px 0 2px}
.game .st{font-size:13px;opacity:.9;flex:1}
.game .btn{margin-top:12px}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--navy);color:#fff;min-height:46px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.lar{background:var(--lar);color:var(--navy)}
.btn.wh{background:#fff;color:var(--navy)}
.btn.gh{background:var(--soft);color:var(--navy)}
.btn.out{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.red{background:var(--errbg);color:var(--err)}
.btn.sm{min-height:34px;padding:7px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.lnk{background:none;border:0;color:var(--navy);font-weight:700;padding:4px;text-decoration:underline;text-underline-offset:3px}
/* formulários */
label.f{display:block;margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--mut)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;font-size:16px;outline:none}
.inp:focus{border-color:var(--navy)}
textarea.inp{min-height:84px;resize:vertical}
.err{background:var(--errbg);color:var(--err);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.okm{background:var(--okbg);color:var(--ok);border-radius:10px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:14px 0}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;font-size:13.5px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--mut)}
.chip.on{border-color:var(--navy);color:var(--navy);background:#EEF2FF}
/* avatar */
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;font-family:'Montserrat',sans-serif}
.bdg .av,.rk .av{color:#fff;font-size:13px;display:inline-flex}
.av.lg{width:84px;height:84px;font-size:28px}
.av.sm{width:28px;height:28px;font-size:11px}
/* ranking */
.rk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .pos{width:28px;text-align:center;font-family:'Montserrat',sans-serif;font-weight:900;color:var(--mut);font-size:15px}
.rk .pos.p1,.rk .pos.p2,.rk .pos.p3{color:#A84E00}
.rk .nm{flex:1;min-width:0}
.rk .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.rk .nm span{font-size:12px;color:var(--mut)}
.rk .pt,.rkc-top .pt{text-align:right;font-family:'Montserrat',sans-serif;font-weight:900;font-size:17px;color:var(--navy)}
.rk .pt small,.rkc-top .pt small{display:block;font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:11px;color:var(--mut)}
.rk.eu{background:#FFF1E3;margin:0 -16px;padding:10px 16px}
.rk.fora{opacity:.5}
/* números */
.kp{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
.kp b{display:block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;color:var(--navy)}
.kp span{font-size:12px;color:var(--mut)}
/* badges */
.bdg{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0;border:0;width:100%;text-align:left}
.bdg .e{font-size:28px;width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bdg b{display:block;font-size:14.5px}
.bdg span{font-size:12.5px;color:var(--mut)}
.bdg.novo{background:#FFF1E3;box-shadow:inset 0 0 0 1.5px #F3D3B0}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bcell{background:var(--soft);border-radius:14px;padding:12px 6px;text-align:center;border:0}
.bcell .e{font-size:30px}
.bcell b{display:block;font-size:12px;margin-top:4px}
.bcell span{font-size:11px;color:var(--mut)}
.bcell.off{opacity:.35;filter:grayscale(1)}
/* tabela */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;color:var(--mut);font-weight:700;padding:6px 4px;border-bottom:1.5px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--mut)}
.tag.ok{background:var(--okbg);color:var(--ok)} .tag.err{background:var(--errbg);color:var(--err)} .tag.gold{background:#FFF1E3;color:#A84E00} .tag.nv{background:#E8EEF9;color:#1C398E}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:24px 0 10px}
.foot button{margin:4px}
/* telas de entrada */
.auth{min-height:100vh;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 32px) 0 40px}
.auth .tagline{opacity:.8;margin:10px 0 22px}
.auth .card{color:var(--ink)}
.stripes{display:flex;gap:6px;margin:18px 0 6px}
.stripes i{display:block;width:34px;height:10px;transform:skewX(-24deg);border-radius:2px}
.gbtn{background:#fff;color:#222;border:1.5px solid var(--line)}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
/* overlay de jogo */
#ov{position:fixed;inset:0;z-index:60;display:none;background:var(--navy3);color:#fff;overflow:auto}
#ov.on{display:block}
.ovw{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 30px;min-height:100vh;display:flex;flex-direction:column}
.ovtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.xbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;width:38px;height:38px;font-size:18px}
.qbar{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.qbar i{display:block;height:100%;background:var(--lar);border-radius:99px;width:100%}
.qtema{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.7}
.qtxt{font-family:'Montserrat',sans-serif;font-weight:800;font-size:21px;line-height:1.3;margin:8px 0 20px}
.alt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:14px;margin:0 0 10px;font-size:15.5px;font-weight:600;min-height:58px}
.alt .l{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:900;flex:none}
.alt.esc{border-color:#fff;background:rgba(255,255,255,.18)}
.alt.cer{background:var(--ok);border-color:var(--ok)}
.alt.err{background:var(--err);border-color:var(--err)}
.alt[disabled]{cursor:default}
.qtime{font-family:'Montserrat',sans-serif;font-weight:900;font-size:15px}
.fb{font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px;text-align:center;margin:6px 0}
.big{font-family:'Montserrat',sans-serif;font-weight:900;font-size:56px;line-height:1}
.ovcard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;margin:12px 0}
.ovcard .mut{color:rgba(255,255,255,.7)}
#cv{display:block;margin:0 auto;border-radius:14px;touch-action:none;background:#2a3140}
.garagem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.garagem.off{opacity:.5}
.gcar{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 6px 9px;color:#F4F1EA;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.gcar img{width:100%;aspect-ratio:300/170;object-fit:contain;display:block;margin-bottom:4px}
.gcar b{font-family:'Montserrat',sans-serif;font-size:13px;font-weight:800}
.gcar span{font-size:10.5px;opacity:.7;line-height:1.25;text-align:center}
.gcar.on{background:#F4F1EA;color:var(--navy);border-color:var(--lar);box-shadow:0 0 0 2px var(--lar)}
.gcar.on span{opacity:.75}
.logo-home{display:flex;align-items:center;background:none;border:0;padding:4px 6px 4px 0;margin:0;cursor:pointer;border-radius:10px}
.logo-home:focus-visible{outline:2px solid var(--lar);outline-offset:2px}
.hint{text-align:center;font-size:12.5px;opacity:.7;margin-top:8px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(10,18,45,.55);align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.mbox{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow:auto}
.mbox h3{font-size:18px;font-weight:900;margin-bottom:6px}
.mact{display:flex;gap:10px;margin-top:16px}
.mact .btn{flex:1}
@media(min-width:600px){#modal{align-items:center}.mbox{border-radius:20px}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;max-width:90vw;display:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{display:block}
.loading{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--mut)}
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--line);border-top-color:var(--lar);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.regras h4{font-size:15px;font-weight:800;margin:16px 0 4px;color:var(--navy)}
.regras p,.regras li{font-size:14px;color:#2B3654}
.regras ul{padding-left:18px;margin:4px 0}
.empty{text-align:center;color:var(--mut);padding:22px 8px;font-size:14px}
/* ===== Placa! ===== */
#ov.pl{overflow:hidden}
.pmesa{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) max(12px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(12px, env(safe-area-inset-left));position:relative;overflow:hidden}
.ptopo{display:flex;align-items:center;justify-content:space-between}
.pc{--w:58px;width:var(--w);height:calc(var(--w) * 1.48);flex:none;border-radius:calc(var(--w) * .16);border:3px solid #fff;position:relative;padding:0;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.28);font-family:'Montserrat',sans-serif;transition:transform .15s,opacity .15s;overflow:hidden}
.pc.cL{background:#EC7000}.pc.cA{background:#2F7FE0}.pc.cV{background:#17935F}.pc.cR{background:#D23F3F}
.pc.cw{background:#14235E}
.pc{box-sizing:border-box}
span.pc{display:flex}
.pc .po{width:74%;height:58%;background:#fff;border-radius:40%/30%;transform:skewX(-10deg);display:flex;align-items:center;justify-content:center;position:relative}
.pc.cL .po{color:#EC7000}.pc.cA .po{color:#2F7FE0}.pc.cV .po{color:#17935F}.pc.cR .po{color:#D23F3F}
.pc.cw .po{background:conic-gradient(#EC7000 0 25%,#2F7FE0 0 50%,#17935F 0 75%,#D23F3F 0);color:#fff}
.pc .po svg{width:62%;height:62%;transform:skewX(10deg)}
.pc.cw .po svg{filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.pc .pv{font-weight:900;font-size:calc(var(--w) * .5);line-height:1;transform:skewX(10deg);letter-spacing:-.04em}
.pc .pv.sm{font-size:calc(var(--w) * .36)}
.pc .pmais{position:absolute;right:6%;bottom:2%;font-weight:900;font-size:calc(var(--w) * .2);color:#fff;transform:skewX(10deg);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pc .pk{position:absolute;left:5px;top:3px;font-weight:900;font-size:calc(var(--w) * .2);line-height:1}
.pc .pr{position:absolute;left:0;right:0;bottom:2px;font-size:calc(var(--w) * .105);font-weight:800;letter-spacing:.04em;text-align:center;opacity:.92}
.pc.mini{--w:30px;border-width:2px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pc.mini .pk,.pc.mini .pr{display:none}
.pc.verso{background:#14235E;border-color:#F4F1EA;flex-direction:column;gap:2px}
.pc.verso:before{content:"";position:absolute;inset:5px;border-radius:7px;background:repeating-linear-gradient(-55deg,rgba(236,112,0,.9) 0 6px,transparent 6px 14px);opacity:.35}
.pc.verso .pvl{position:relative;font-weight:900;font-size:calc(var(--w) * .17);color:#F4F1EA;transform:skewX(-10deg);letter-spacing:.02em}
.pc.verso .pn{position:relative;font-size:11px;font-weight:700;color:#F4F1EA;opacity:.8}
.pc.verso.pode{box-shadow:0 0 0 3px var(--lar),0 6px 14px rgba(0,0,0,.3);animation:pulso 1.4s ease-in-out infinite}
.pc[disabled]{cursor:default}
@keyframes pulso{50%{transform:translateY(-3px)}}
.pops{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none;flex:none}
.pops::-webkit-scrollbar{display:none}
.pop{min-width:84px;flex:1 0 84px;background:rgba(255,255,255,.07);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;position:relative}
.pop b{font-size:12.5px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .pnc{font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
.pop.vez{box-shadow:inset 0 0 0 2px var(--lar);background:rgba(236,112,0,.14)}
.pgrito{display:inline-block;background:var(--lar);color:var(--navy);font-family:'Montserrat',sans-serif;font-weight:900;font-size:10.5px;border-radius:6px;padding:2px 6px;transform:skewX(-10deg)}
.pmulta{background:#D23F3F;color:#fff;border:0;border-radius:8px;font-weight:900;font-size:12px;padding:4px 9px;margin-top:2px;animation:pulso .8s ease-in-out infinite;font-family:'Montserrat',sans-serif}
.pcentro{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;gap:26px;position:relative}
.pmonte{display:flex;flex-direction:column;align-items:center;gap:6px}
.pmonte .pc{--w:64px}
.plab{font-size:11.5px;opacity:.75}
.pdesc{position:relative;width:96px;height:140px}
.pdesc .pc{--w:90px;position:absolute;left:3px;top:2px}
.pdesc .pc.topo{box-shadow:0 0 0 4px var(--cor),0 0 26px var(--cor),0 8px 18px rgba(0,0,0,.35)}
.pdesc .pc.atras{opacity:.55}
.pdesc .pc.a0{transform:rotate(-9deg) translate(-8px,2px)}.pdesc .pc.a1{transform:rotate(7deg) translate(6px,0)}
.pdesc .pc.entra{animation:entra .32s cubic-bezier(.2,.8,.3,1.2)}
@keyframes entra{from{transform:translateY(60px) scale(1.25) rotate(8deg);opacity:.2}}
.pinfo{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pcorlab{font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;color:#fff;border-radius:99px;padding:4px 10px}
.psent{font-size:12px;opacity:.8}
.pacum{background:#D23F3F;color:#fff;font-family:'Montserrat',sans-serif;font-weight:900;font-size:12px;border-radius:8px;padding:4px 8px}
.plog{font-size:13px;text-align:center;opacity:.85;min-height:2.6em;line-height:1.3;flex:none}
.paviso{background:rgba(255,255,255,.09);border-radius:12px;padding:9px 12px;font-size:13px;flex:none}
.paviso .btn{margin-left:4px;vertical-align:middle}
.pminha{flex:none;background:rgba(255,255,255,.05);border-radius:18px;padding:10px 10px 8px}
.pminha.vez{background:rgba(236,112,0,.12);box-shadow:inset 0 0 0 1.5px rgba(236,112,0,.5)}
.pstat{font-family:'Montserrat',sans-serif;font-weight:800;font-size:14px}
.pgritar{background:var(--lar);color:var(--navy);border:0;border-radius:10px;font-family:'Montserrat',sans-serif;font-weight:900;font-size:15px;padding:7px 14px;transform:skewX(-10deg)}
.pgritar.urg{animation:pulso .6s ease-in-out infinite;box-shadow:0 0 0 3px #fff}
.pmao{display:flex;gap:0;overflow-x:auto;padding:16px 4px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.pmao .pc+.pc{margin-left:var(--ov,6px)}
.pmao .pc{cursor:pointer}
.pmao .pc.ok{transform:translateY(-10px)}
.pmao .pc.off{opacity:.45;filter:saturate(.6)}
.pmao .pc.nova{animation:nova .4s ease-out}
.pmao .pc.comprada{box-shadow:0 0 0 3px #fff,0 6px 14px rgba(0,0,0,.28)}
.pmao .pc.nao{animation:nao .3s}
@keyframes nova{from{transform:translateY(-40px);opacity:0}}
@keyframes nao{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pfolha{position:absolute;inset:0;background:rgba(5,10,30,.6);display:flex;align-items:flex-end;z-index:5}
.pfolha-in{background:#fff;color:var(--ink);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:10px}
.pfolha-in>b{font-family:'Montserrat',sans-serif;font-size:17px}
.pcores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcores button{border:0;border-radius:14px;color:#fff;font-family:'Montserrat',sans-serif;font-weight:900;font-size:16px;min-height:62px}
.plugares{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.plugar{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.plugar b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plugar span:not(.av){font-size:11.5px;opacity:.7}
.plugar.vazio{background:transparent;border:1.5px dashed rgba(255,255,255,.25)}
.pfim{flex:none;text-align:center;display:flex;flex-direction:column;gap:10px}
.pfim h2{font-size:22px;font-weight:900}
.pfim-ic{font-size:48px;line-height:1}
.pfim-l{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px;text-align:left}
.pfim .bdg span{color:var(--mut)}
.pl-card h3{font-size:15px}
.pl-leque{display:flex;flex:none;padding:4px 0 0 4px}
.pl-leque .pc+.pc{margin-left:-14px}
.pl-leque .pc:nth-child(1){transform:rotate(-10deg)}.pl-leque .pc:nth-child(3){transform:rotate(10deg)}
.pl-mesa{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
.pl-mesa+.pl-mesa{margin-top:0}
.pl-avs{display:flex;flex:none}
.pl-avs .av+.av{margin-left:-8px;box-shadow:0 0 0 2px #fff}
.av.bot{background:#F4F1EA;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.av.bot.sm{font-size:14px}
.garagem.rolar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.garagem.rolar .gcar{flex:0 0 112px}
.atrs{display:grid;gap:5px;margin-top:10px}
.atr{display:grid;grid-template-columns:72px 1fr 78px;align-items:center;gap:8px;font-size:11.5px}
.atr span{opacity:.75}.atr em{font-style:normal;opacity:.85;text-align:right}
.atr i{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}.atr i b{display:block;height:100%;background:#9FD3FF;border-radius:3px}
.gsaldo{background:var(--navy);color:#fff;margin-top:16px}
.gnum{font-family:'Montserrat',sans-serif;font-weight:900;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.gporto{background:#EAF3FE;box-shadow:inset 0 0 0 1.5px #BFDCFB}
.gselo{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:2px 7px;vertical-align:2px}
.gselo.itau{background:#EC7000;color:#fff}.gselo.porto{background:#499EF2;color:#fff}
.gmulta{background:#FFF6E5;box-shadow:inset 0 0 0 1.5px #F5D08A;margin-bottom:12px}
.gvenc{color:#B4540A;font-weight:700}
.gselo.novo{background:#17935F;color:#fff}
.ginfo span.gselo,.gshow-info .gselo{display:inline-block;width:auto;align-self:flex-start}
.gshow{background:linear-gradient(135deg,#14235E,#1C398E);color:#fff;border-radius:20px;padding:14px 0 16px;margin:4px 0 14px;overflow:hidden}
.gshow-top{display:flex;flex-direction:column;gap:2px;padding:0 16px 10px}
.gshow-top b{font-family:Montserrat,sans-serif;font-size:19px;font-weight:900}
.gshow-kick{font:900 11px Montserrat,sans-serif;letter-spacing:.16em;color:#FF8A2B}
.gshow-trilho{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 4px;-webkit-overflow-scrolling:touch}
.gshow-car{flex:none;width:78%;max-width:300px;scroll-snap-align:start;background:rgba(255,255,255,.07);border-radius:16px;overflow:hidden}
.gshow-car img{display:block;width:100%;aspect-ratio:300/157;object-fit:cover;background:radial-gradient(ellipse at 50% 70%,rgba(255,255,255,.18),transparent 70%)}
.gshow-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.gshow-info b{font-size:16px}
.gshow .gatr span{color:#fff;opacity:.85}
.gatr.gatr{border:0;background:none;padding:0;cursor:pointer;text-align:left;font:inherit;font-size:11.5px;color:var(--mut)}
.gatr-i{opacity:.55;font-weight:800}
.gleg{margin:-4px 0 10px}
.gex{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.gex-ic{flex:none;font-size:22px;line-height:1}
.gex-v{display:inline-block;font-size:12px;font-weight:800;background:#EAF3FE;color:#1C398E;border-radius:6px;padding:1px 7px;margin-left:4px}
.mcar{width:34px;height:18px;object-fit:cover;border-radius:4px;vertical-align:-4px;margin-right:6px;background:#EEF1F7}
.rk .nm .rkcar{display:flex;align-items:center}
.rkc{padding:0;overflow:hidden;margin-bottom:10px}
.rkc-top{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.rkc-foto{flex:none;width:96px;height:50px;object-fit:cover;border-radius:10px;background:#EEF1F7}
.rkc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rkc-info>b{font-size:15px}
.rkc-rec{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:2px}
.rkc-rec .av{width:22px;height:22px;font-size:10px}
.rkc-lista{padding:0 14px 8px;border-top:1px solid var(--line)}
.dvez{margin-top:12px}
.btpausa{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;width:40px;height:34px;border:0;border-radius:10px;background:rgba(13,24,64,.72);color:#fff;font:900 13px Montserrat,sans-serif;letter-spacing:-1px;cursor:pointer}
.pausa{position:absolute;inset:0;z-index:6;background:rgba(10,18,48,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.pausa[hidden]{display:none}
.pausa-box{background:#14235E;color:#fff;border-radius:18px;padding:20px;width:100%;max-width:280px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pausa-box h3{margin:6px 0 2px;font-size:22px}
.rkbtn{width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.dalerta{margin-top:10px;background:#FFF2D9;color:#8A4A00;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
.dres{display:flex;justify-content:space-between;align-items:center;border-radius:12px;padding:10px 14px;background:#F1EEE6;margin:6px 0 10px}
.dres b{font-size:16px}.dres span{font:900 22px Montserrat,sans-serif}
.dres.win{background:#DFF3E8;color:#17935F}.dres.lose{background:#FBE7DF;color:#B4540A}.dres.emp{background:#EAF3FE;color:#1C398E}
.dtab{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.dtr{display:grid;grid-template-columns:.9fr 1fr 1fr;gap:6px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;align-items:center}
.dtr:first-child{border-top:0}.dtr.dth{background:#F7F4EC;font-weight:800;font-size:12px}
.dtr.g{background:#F1FAF5}.dtr.p{background:#FDF3EF}

.dwin-t{font-size:11px;font-weight:800;color:#17935F}.dlose-t{font-size:11px;font-weight:800;color:#B4540A}
.seg.seg6{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.seg.seg6 button{min-width:0}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

.dstats b{display:block;font:900 18px Montserrat,sans-serif;color:var(--navy)}
.dstats span{font-size:11px;color:var(--mut)}
.dcard{border:1.5px solid #F5D08A}
.dduel{margin-bottom:10px}
.dplacar{font:900 26px Montserrat,sans-serif;color:var(--navy);white-space:nowrap}
.dplacar small{font-size:15px;opacity:.5;margin:0 4px}
.dapostas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding:10px;background:#F7F4EC;border-radius:12px}
.dapostas .mcar{vertical-align:-4px}
.dcorridas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dcor{background:#F1EEE6;border-radius:10px;padding:8px;min-width:0}
.dcor.ganhei{background:#DFF3E8;box-shadow:inset 0 0 0 1.5px #7CCFA4}
.dcor.perdi{background:#FBE7DF}
.dcor .mcar{width:26px;height:14px;margin:0 0 0 4px;vertical-align:-2px}
.tag.dwin{background:#DFF3E8;color:#17935F}.tag.dlose{background:#FBE7DF;color:#B4540A}
.gsug{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ffoto{display:flex;gap:12px;align-items:center;margin-top:4px}
.ffprev{flex:none;width:64px;height:64px;border-radius:50%;background:#F1EEE6;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.ffprev img{width:100%;height:100%;object-fit:cover}
.tag.gvenc{background:#FFE8C2;color:#8A4A00}
.glista{display:grid;gap:10px;margin-top:10px}
.gitem{display:flex;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 1px 2px rgba(20,35,94,.05),0 6px 18px rgba(20,35,94,.05);align-items:center}

.gitem.vendido{opacity:.6}

.ginfo>span{display:block;font-size:12.5px;color:var(--mut)}
.gatr{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:4px}
.gpreco{font-family:'Montserrat',sans-serif;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.gpreco small{font-family:'Public Sans',system-ui,sans-serif;font-weight:500;font-size:11.5px;color:var(--mut)}

.gcmp{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:6px}
.gcmp.bom{color:#0E6B43;background:#DDF4E8}.gcmp.alto{color:#8A4A00;background:#FFF0DD}.gcmp.ok{color:#1C398E;background:#EAF3FE}

.gkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}

.gtr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
